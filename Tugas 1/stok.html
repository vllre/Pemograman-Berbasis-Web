<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informasi Bahan Ajar — SITTA UT</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .grid-stok { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
    </style>
</head>
<body onload="loadStokVisual()">
    <div class="app-wrapper">
        <nav class="sidebar">
            <div class="sidebar-header"><h3>SITTA UT</h3></div>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html">🏠 Dashboard</a></li>
                <li><a href="stok.html">📦 Informasi Bahan Ajar</a></li>
                <li><a href="tracking.html">🚚 Tracking Pengiriman</a></li>
                <li>
                    <button class="dropdown-btn" onclick="toggleDropdown()">📊 Laporan ▼</button>
                    <div id="dropLaporan" class="dropdown-container">
                        <a href="#">📉 Monitoring Progress DO</a>
                        <a href="#">📋 Rekap Bahan Ajar</a>
                    </div>
                </li>
                <li style="margin-top: 50px;">
                    <a href="login.html" style="color: #ff6666;">🚪 Keluar</a>
                </li>
                </ul>
        </nav>

        <div class="main-content">
            <header class="top-bar"><strong>Informasi Stok</strong></header>
            <div class="content-body">
                <div class="card">
                    <h3>Tambah Stok Baru</h3>
                    <input type="text" id="newNama" placeholder="Nama Barang">
                    <input type="text" id="newKode" placeholder="Kode Barang">
                    <input type="text" id="newLokasi" placeholder="Kode Lokasi">
                    <input type="number" id="newQty" placeholder="Jumlah Stok">
                    <button onclick="addNewCard()">Tambah Data</button>
                </div>
                <div id="stokContainer" class="grid-stok"></div>
            </div>
        </div>
    </div>
    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
